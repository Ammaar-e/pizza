# Option A — single EC2 instance. Everything runs in one Docker Compose project.
# PostgreSQL runs directly on this instance (container) with data on a persistent EBS-backed host path.
# Usage:  cd deploy && cp .env.example .env && (edit) && docker compose up -d --build
name: pizza

x-backend: &backend
  build: ../backend
  image: pizza-backend:latest
  env_file: .env
  restart: unless-stopped
  volumes:
    - media:/app/media

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${PG_DATA_DIR:-/srv/pizza/pgdata}:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 30 }

  migrate:
    <<: *backend
    restart: "no"
    command: ["sh", "./entrypoint-migrate.sh"]
    depends_on:
      postgres: { condition: service_healthy }

  backend:
    <<: *backend
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck: { test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz/"], interval: 15s, retries: 5 }

  worker:
    <<: *backend
    command: ["celery", "-A", "config", "worker", "-Q", "default,integrations", "-c", "4", "-l", "INFO"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  beat:
    <<: *backend
    command: ["celery", "-A", "config", "beat", "-l", "INFO", "-s", "/tmp/celerybeat-schedule"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  frontend:
    build: ../frontend
    image: pizza-frontend:latest
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    depends_on: [backend, frontend]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${TLS_CERT_DIR:-/srv/pizza/certs}:/etc/nginx/certs:ro
      - ${ACME_WEBROOT:-/srv/pizza/acme}:/var/www/certbot:ro
      - media:/srv/media:ro

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      PGHOST: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${BACKUP_DIR:-/srv/pizza/backups}:/backups
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/backup-loop.sh"]
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  media:
  redisdata:
