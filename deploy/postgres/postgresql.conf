# Baseline for a 4 GB / 2 vCPU instance shared with the application (Option A).
# Option B overrides shared_buffers/effective_cache_size on the dedicated database instance.
listen_addresses = '*'
max_connections = 150
shared_buffers = 512MB
effective_cache_size = 1536MB
work_mem = 8MB
maintenance_work_mem = 128MB
wal_level = replica
max_wal_size = 2GB
checkpoint_timeout = 10min
log_min_duration_statement = 500
log_line_prefix = '%m [%p] %u@%d '
password_encryption = scram-sha-256
