# Reverse proxy: TLS termination, routing to Next.js (UI) and Django/Daphne (API + WebSockets).
worker_processes auto;
events { worker_connections 2048; }

http {
  include       /etc/nginx/mime.types;
  sendfile      on;
  server_tokens off;
  client_max_body_size 6m;
  log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent rt=$request_time rid=$request_id';
  access_log /var/log/nginx/access.log main;

  # Coarse abuse protection in front of the application's own per-user / per-client rate limits.
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

  # Resolve container names through Docker's DNS at request time (re-checked every 10 s). A static
  # `upstream { server backend:8000; }` is resolved once when nginx starts: after
  # `docker compose up -d --build` recreates the backend with a new IP, nginx keeps sending requests to
  # the old address and every API call returns 502 while the website itself still loads.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  server {
    listen 80;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;

    set $backend  backend:8000;
    set $frontend frontend:3000;

    # API outages return JSON (not an HTML page) so the POS apps and portals can show a clear message.
    location @backend_down {
      default_type application/json;
      return 502 '{"error":{"code":"backend_unavailable","message":"The POS API service is not responding (nginx could not reach the backend container). See deploy/TROUBLESHOOTING.md.","request_id":"$request_id"}}';
    }

    location = /api/v1/auth/login/     { limit_req zone=login burst=5 nodelay; proxy_pass http://$backend; error_page 502 503 504 = @backend_down; }
    location = /api/v1/auth/pos/login/ { limit_req zone=login burst=10 nodelay; proxy_pass http://$backend; error_page 502 503 504 = @backend_down; }
    # Provider webhooks: answered immediately by the backend, processed asynchronously.
    location /api/v1/integrations/     { proxy_read_timeout 30s; proxy_pass http://$backend; error_page 502 503 504 = @backend_down; }
    location /api/   { limit_req zone=api burst=60 nodelay; proxy_read_timeout 60s; proxy_pass http://$backend; error_page 502 503 504 = @backend_down; }
    location /admin/ { proxy_pass http://$backend; error_page 502 503 504 = @backend_down; }
    location /static/ { proxy_pass http://$backend; error_page 502 503 504 = @backend_down; }
    location /media/  { alias /srv/media/; }
    location /healthz/ { proxy_pass http://$backend; error_page 502 503 504 = @backend_down; }
    location /ws/ {
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 1h;
      proxy_pass http://$backend;
    }
    location / { proxy_pass http://$frontend; }
  }
}
